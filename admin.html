<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>แอดมิน | Cocoa Lane</title><link rel="stylesheet" href="style.css">
<nav></nav><main><div class="no"><h1>จัดการออเดอร์</h1><input id="k" type="password" placeholder="รหัสแอดมิน"><input id="s" placeholder="ชื่อ ที่อยู่ เบอร์โทรผู้ส่ง (ใช้บนใบจ่าหน้า)"><select id="st"><option value="">ทุกสถานะ</option><option>ใหม่</option><option>หยิบแล้ว</option><option>แพ็คแล้ว</option><option>ส่งแล้ว</option></select>
<p><button onclick="load()">โหลดออเดอร์</button> <button onclick="pick()">ใบหยิบสินค้า</button> <button onclick="pack()">ใบแพ็คสินค้า</button> <button onclick="window.labels()">ใบจ่าหน้าพัสดุ</button> <button onclick="print()">พิมพ์</button></p><p class="err" id="m"></p></div><div id="v" class="scroll"></div></main><script src="config.js"></script><script src="app.js"></script><script>
let all = []; const ST = ["ใหม่", "หยิบแล้ว", "แพ็คแล้ว", "ส่งแล้ว"];
$("#s").value = localStorage.getItem("sender") || ""; $("#s").onchange = e => localStorage.setItem("sender", e.target.value); $("#st").onchange = list;
const cur = () => all.filter(o => !$("#st").value || o.status === $("#st").value);
const items = o => o.items.split(",").map(s => { const i = s.lastIndexOf("x"); return [s.slice(0, i), +s.slice(i + 1)]; });
const nm = k => P[k] ? P[k].n : k;
async function load() { $("#m").textContent = "กำลังโหลด..."; try { const r = await api({action: "list", key: $("#k").value.trim()}); if (r.error) throw r.error; all = r.orders.reverse(); $("#m").textContent = ""; list(); } catch (x) { $("#m").textContent = x; } }
function list() { $("#v").innerHTML = "<table><tr><th>ออเดอร์</th><th>ลูกค้า</th><th>สินค้า</th><th>ยอด</th><th>สถานะ</th></tr>" + cur().map(o => "<tr><td>" + esc(o.id) + "<br>" + esc(o.time) + "</td><td>" + esc(o.name) + "<br>" + esc(o.phone) + "<br>" + esc(o.address) + " " + esc(o.zip) + "<br>" + esc(o.note) + "</td><td>" + items(o).map(x => esc(nm(x[0])) + " x " + x[1]).join("<br>") + "</td><td>" + esc(o.total) + '</td><td><select onchange="upd(\'' + esc(o.id) + '\',this.value)">' + ST.map(s => "<option" + (s === o.status ? " selected" : "") + ">" + s + "</option>").join("") + "</select></td></tr>").join("") + "</table>"; }
async function upd(id, s) { try { const r = await api({action: "status", key: $("#k").value.trim(), id: id, status: s}); if (r.error) throw r.error; all.find(o => o.id === id).status = s; $("#m").textContent = ""; } catch (x) { $("#m").textContent = x; } list(); }
function pick() { const t = {}; cur().forEach(o => items(o).forEach(x => t[x[0]] = (t[x[0]] || 0) + x[1])); $("#v").innerHTML = "<h2>ใบหยิบสินค้า (" + cur().length + " ออเดอร์)</h2><table><tr><th>SKU</th><th>สินค้า</th><th>จำนวน</th><th>หยิบแล้ว</th></tr>" + Object.entries(t).map(x => "<tr><td>" + esc(x[0]) + "</td><td>" + esc(nm(x[0])) + "</td><td><b>" + x[1] + "</b></td><td>[ &nbsp; ]</td></tr>").join("") + "</table>"; }
function pack() { $("#v").innerHTML = cur().map(o => '<div class="label"><b>ใบแพ็ค ' + esc(o.id) + "</b><br>" + esc(o.name) + "<br>" + items(o).map(x => "[ &nbsp; ] " + esc(x[0]) + " " + esc(nm(x[0])) + " x " + x[1]).join("<br>") + "<br>หมายเหตุ: " + esc(o.note || "-") + "</div>").join(""); }
function labels() { $("#v").innerHTML = cur().map(o => '<div class="label"><small>ผู้ส่ง: ' + esc($("#s").value || "Cocoa Lane") + '</small><div class="to"><b>ผู้รับ: ' + esc(o.name) + "</b><br>โทร " + esc(o.phone) + "<br>" + esc(o.address) + "<br><b>" + esc(o.zip) + "</b></div><p>" + esc(o.id) + " | เก็บเงินปลายทาง " + esc(o.total) + " บาท</p></div>").join(""); }
</script></html>
